[project]
name = "talkfiesta-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.120",
    "celery[redis]>=5.6,<6",
    "email-validator>=2.2,<3",
    "fakeredis>=2.40.0",
    "fastapi>=0.162,<1",
    "langchain>=1.4,<2",
    "langchain-openai>=1.7,<2",
    "langgraph>=1.2,<2",
    "langsmith>=0.14,<1",
    "openai>=3.40,<4",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "tenacity>=9.2.1",
    "testcontainers>=4.15.0",
    "time-machine>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
