      TRAVEL: "Staying energized during long-distance trips"

  - day: 14
    theme: "Cycle 1 Week 2 milestone check-in"
    learning_objective: "Synthesize two weeks of practice and evaluate what strategies worked best."
    prerequisites:
      - "Days 8–13 completed."
    grammar_focus:
