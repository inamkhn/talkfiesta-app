    grammar_focus:
      - "Connectors of purpose (in order to, so that)"
    vocabulary_theme:
      topic: "Prioritization, focus, and trade-offs"
      target_count: 10
      avoid: []
    speaking:
      exercise_type: "CONVERSATIONAL"
      target_duration_seconds: 60
