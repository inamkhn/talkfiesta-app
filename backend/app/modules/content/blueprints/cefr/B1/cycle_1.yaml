    learning_objective: "Describe a cultural tradition or communication norm and explain its meaning."
    prerequisites:
      - "Can compare customs across contexts."
    grammar_focus:
      - "Defining vs. non-defining relative clauses"
    vocabulary_theme:
      topic: "Culture, perspective, and respect"
