    goal_variant_rules:
      GENERAL: "Sharing a local tradition with an international friend"
      BUSINESS: "Navigating communication norms in global teams"
      TRAVEL: "Respecting local etiquette while visiting a new country"

  - day: 16
    theme: "Making a persuasive recommendation"
    learning_objective: "Propose a practical improvement supported by clear reasons and an example."
    prerequisites:
      - "Can state an opinion with supporting reasons."
    grammar_focus:
      - "Conditionals with unless and provided that"
    vocabulary_theme:
